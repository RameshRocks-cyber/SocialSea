spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.otp.allow-email-failure=false
app.otp.expose-debug-otp=false
app.otp.return-fallback-otp-on-delivery-failure=false
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://socialsea.co.in}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:https://socialsea.co.in,https://www.socialsea.co.in}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:true}
app.upload.provider=${APP_UPLOAD_PROVIDER:s3}
app.upload.allow-local-fallback=${APP_UPLOAD_ALLOW_LOCAL_FALLBACK:false}
app.upload.serve-local=${APP_UPLOAD_SERVE_LOCAL:false}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
