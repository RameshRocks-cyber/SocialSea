spring.application.name=socialsea
spring.config.import=optional:file:.env.local,optional:file:.env
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialsea}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hibernate SQL logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# JWT Configuration
jwt.secret=${JWT_SECRET:socialsea_secret_key_123_secure_and_long_enough_for_hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://socialsea.co.in}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:https://socialsea.netlify.app,https://socialsea.co.in,https://www.socialsea.co.in,http://localhost:5173,http://43.205.213.14:5173}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:false}
app.admin.open=${APP_ADMIN_OPEN:false}
app.admin.allowed-ips=${APP_ADMIN_ALLOWED_IPS:}
app.admin.secret=${APP_ADMIN_SECRET:}
app.admin.hide=${APP_ADMIN_HIDE:true}
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}

app.upload.allowed-types=${APP_UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,audio/mpeg,audio/wav,audio/mp4,application/pdf}
app.upload.allowed-extensions=${APP_UPLOAD_ALLOWED_EXTENSIONS:png,jpg,jpeg,webp,gif,mp4,webm,mp3,wav,m4a,pdf}
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:209715200}
app.upload.allow-local-fallback=${APP_UPLOAD_ALLOW_LOCAL_FALLBACK:false}
app.upload.serve-local=${APP_UPLOAD_SERVE_LOCAL:false}

# LiveKit
livekit.url=${LIVEKIT_URL:wss://socialsea.co.in}
livekit.api-key=${LIVEKIT_API_KEY:}
livekit.api-secret=${LIVEKIT_API_SECRET:}

# OTP behavior (safe defaults, override in profile/env)
app.otp.allow-email-failure=${APP_OTP_ALLOW_EMAIL_FAILURE:false}
app.otp.expose-debug-otp=${APP_OTP_EXPOSE_DEBUG_OTP:false}
app.otp.return-fallback-otp-on-delivery-failure=${APP_OTP_RETURN_FALLBACK_OTP_ON_DELIVERY_FAILURE:false}
