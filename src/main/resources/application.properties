spring.application.name=socialsea
spring.config.import=optional:file:../.env.production.local,optional:file:../.env.production,optional:file:../.env.local,optional:file:../.env,optional:file:.env.production.local,optional:file:.env.production,optional:file:.env.local,optional:file:.env
server.port=8080
server.address=0.0.0.0
server.forward-headers-strategy=framework
server.http2.enabled=true
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/plain,text/html,text/xml,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.runtime.ec2=${APP_RUNTIME_EC2:}
app.runtime.enforce-prod-on-ec2=${APP_RUNTIME_ENFORCE_PROD_ON_EC2:true}

app.upload.provider=${APP_UPLOAD_PROVIDER:cloudinary}
app.s3.bucket=${APP_S3_BUCKET:}
app.s3.prefix=${APP_S3_PREFIX:socialsea}
app.s3.region=${APP_S3_REGION:}
app.s3.public-base-url=${APP_S3_PUBLIC_BASE_URL:}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialsea}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
app.redis.cache-ttl=${APP_REDIS_CACHE_TTL:10m}

# Redis presence
app.presence.online-ttl=${APP_PRESENCE_ONLINE_TTL:5m}
app.presence.session-ttl=${APP_PRESENCE_SESSION_TTL:12h}
app.presence.last-seen-ttl=${APP_PRESENCE_LAST_SEEN_TTL:7d}
app.presence.persist-throttle=${APP_PRESENCE_PERSIST_THROTTLE:15s}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Hibernate SQL logging
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:1GB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:1GB}

# Cloudinary Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:https://socialsea.co.in}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:https://socialsea.netlify.app,https://socialsea.co.in,https://www.socialsea.co.in}
app.security.require-https=${APP_SECURITY_REQUIRE_HTTPS:true}
app.admin.open=${APP_ADMIN_OPEN:false}
app.admin.allowed-ips=${APP_ADMIN_ALLOWED_IPS:}
app.admin.secret=${APP_ADMIN_SECRET:}
app.admin.hide=${APP_ADMIN_HIDE:true}
app.admin.bootstrap.enabled=${APP_ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.email=${APP_ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${APP_ADMIN_BOOTSTRAP_PASSWORD:}

app.upload.allowed-types=${APP_UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/x-matroska,video/matroska,audio/mpeg,audio/wav,audio/mp4,audio/webm,audio/ogg,audio/opus,application/pdf}
app.upload.allowed-extensions=${APP_UPLOAD_ALLOWED_EXTENSIONS:png,jpg,jpeg,webp,gif,mp4,webm,mkv,mp3,wav,m4a,ogg,opus,pdf}
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:1073741824}
app.upload.max-image-bytes=${APP_UPLOAD_MAX_IMAGE_BYTES:20971520}
app.upload.allow-local-fallback=${APP_UPLOAD_ALLOW_LOCAL_FALLBACK:false}
app.upload.serve-local=${APP_UPLOAD_SERVE_LOCAL:false}
app.upload.local-cache-max-age-seconds=${APP_UPLOAD_LOCAL_CACHE_MAX_AGE_SECONDS:604800}
app.upload.local-cache-public=${APP_UPLOAD_LOCAL_CACHE_PUBLIC:true}
app.video-editing.enabled=${APP_VIDEO_EDITING_ENABLED:true}
app.video-editing.ffmpeg-bin=${APP_VIDEO_EDITING_FFMPEG_BIN:ffmpeg}
app.video-editing.ffprobe-bin=${APP_VIDEO_EDITING_FFPROBE_BIN:ffprobe}
app.video-editing.timeout-seconds=${APP_VIDEO_EDITING_TIMEOUT_SECONDS:240}
app.video-editing.drawtext-font-file=${APP_VIDEO_EDITING_DRAWTEXT_FONT_FILE:}
app.feed.max-items=${APP_FEED_MAX_ITEMS:240}
app.feed.max-video-items=${APP_FEED_MAX_VIDEO_ITEMS:180}
app.feed.cache-seconds=${APP_FEED_CACHE_SECONDS:20}
app.feed.by-id-cache-seconds=${APP_FEED_BY_ID_CACHE_SECONDS:45}
app.feed.anonymous-cache-seconds=${APP_FEED_ANONYMOUS_CACHE_SECONDS:60}
app.reels.max-items=${APP_REELS_MAX_ITEMS:180}
app.reels.cache-seconds=${APP_REELS_CACHE_SECONDS:15}

# Optional external STOMP broker relay (RabbitMQ/ActiveMQ). Keep disabled unless configured.
app.websocket.broker-relay.enabled=${APP_WEBSOCKET_BROKER_RELAY_ENABLED:false}
app.websocket.broker-relay.host=${APP_WEBSOCKET_BROKER_RELAY_HOST:localhost}
app.websocket.broker-relay.port=${APP_WEBSOCKET_BROKER_RELAY_PORT:61613}
app.websocket.broker-relay.username=${APP_WEBSOCKET_BROKER_RELAY_USERNAME:}
app.websocket.broker-relay.password=${APP_WEBSOCKET_BROKER_RELAY_PASSWORD:}

# LiveKit
livekit.url=${LIVEKIT_URL:${LK_URL:wss://socialsea-mb50m9kr.livekit.cloud}}
livekit.api-key=${LIVEKIT_API_KEY:${LIVEKIT_APIKEY:${LK_API_KEY:${LIVEKIT_KEY:}}}}
livekit.api-secret=${LIVEKIT_API_SECRET:${LIVEKIT_APISECRET:${LK_API_SECRET:${LIVEKIT_SECRET:}}}}

# OTP behavior (safe defaults, override in profile/env)
app.otp.allow-email-failure=${APP_OTP_ALLOW_EMAIL_FAILURE:false}
app.otp.expose-debug-otp=${APP_OTP_EXPOSE_DEBUG_OTP:false}
app.otp.return-fallback-otp-on-delivery-failure=${APP_OTP_RETURN_FALLBACK_OTP_ON_DELIVERY_FAILURE:false}

# Web push (for mobile notification shade delivery)
app.web-push.public-key=${APP_WEB_PUSH_PUBLIC_KEY:}
app.web-push.private-key=${APP_WEB_PUSH_PRIVATE_KEY:}
app.web-push.subject=${APP_WEB_PUSH_SUBJECT:mailto:support@socialsea.co.in}

# Actuator exposure (keep minimal in public deployments)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
