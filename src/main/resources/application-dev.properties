spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/socialsea}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.otp.allow-email-failure=true
app.otp.expose-debug-otp=true
app.feed.include-unapproved=true
app.frontend.base-url=http://localhost:5173
app.security.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://43.205.229.211:5173
app.security.require-https=false
spring.sql.init.mode=always

